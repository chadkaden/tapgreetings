services:
  tapgreetings:
    build:
      context: .
      dockerfile: Dockerfile
    image: tapgreetings:latest
    container_name: tapgreetings-app
    ports:
      - "3016:80"
    restart: always
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NODE_ENV=production
