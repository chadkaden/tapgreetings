server {
    listen 80;
    server_name localhost tapgreetings.com www.tapgreetings.com;

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects preserve host & port
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Friendly Aliases & Redirects for Series 1 (001 - 008)
    location = /santa { return 301 /001/; }
    location = /santa/ { return 301 /001/; }
    location = /frosty { return 301 /002/; }
    location = /frosty/ { return 301 /002/; }
    location = /rudolph { return 301 /003/; }
    location = /rudolph/ { return 301 /003/; }
    location = /jack-frost { return 301 /004/; }
    location = /jack-frost/ { return 301 /004/; }
    location = /nutcracker { return 301 /005/; }
    location = /nutcracker/ { return 301 /005/; }
    location = /the-tree { return 301 /006/; }
    location = /the-tree/ { return 301 /006/; }
    location = /snowflake { return 301 /007/; }
    location = /snowflake/ { return 301 /007/; }
    location = /gift { return 301 /008/; }
    location = /gift/ { return 301 /008/; }
    location = /gingerbread { return 301 /009/; }
    location = /gingerbread/ { return 301 /009/; }
    location = /mrs-claus { return 301 /010/; }
    location = /mrs-claus/ { return 301 /010/; }
    location = /elf { return 301 /011/; }
    location = /elf/ { return 301 /011/; }
    location = /polar-bear { return 301 /012/; }
    location = /polar-bear/ { return 301 /012/; }
    location = /penguin { return 301 /013/; }
    location = /penguin/ { return 301 /013/; }
    location = /sugar-plum-fairy { return 301 /014/; }
    location = /sugar-plum-fairy/ { return 301 /014/; }
    location = /fairy { return 301 /014/; }
    location = /fairy/ { return 301 /014/; }
    location = /snow-monster { return 301 /015/; }
    location = /snow-monster/ { return 301 /015/; }
    location = /yeti { return 301 /015/; }
    location = /yeti/ { return 301 /015/; }
    location = /stocking-puppy { return 301 /016/; }
    location = /stocking-puppy/ { return 301 /016/; }
    location = /puppy { return 301 /016/; }
    location = /puppy/ { return 301 /016/; }

    # Legacy 2-digit to 3-digit redirects
    location = /01 { return 301 /001/; }
    location = /01/ { return 301 /001/; }
    location = /02 { return 301 /002/; }
    location = /02/ { return 301 /002/; }
    location = /03 { return 301 /003/; }
    location = /03/ { return 301 /003/; }
    location = /04 { return 301 /004/; }
    location = /04/ { return 301 /004/; }
    location = /05 { return 301 /005/; }
    location = /05/ { return 301 /005/; }
    location = /06 { return 301 /006/; }
    location = /06/ { return 301 /006/; }
    location = /07 { return 301 /007/; }
    location = /07/ { return 301 /007/; }
    location = /08 { return 301 /008/; }
    location = /08/ { return 301 /008/; }
    location = /09 { return 301 /009/; }
    location = /09/ { return 301 /009/; }
    location = /10 { return 301 /010/; }
    location = /10/ { return 301 /010/; }
    location = /11 { return 301 /011/; }
    location = /11/ { return 301 /011/; }
    location = /12 { return 301 /012/; }
    location = /12/ { return 301 /012/; }
    location = /13 { return 301 /013/; }
    location = /13/ { return 301 /013/; }
    location = /14 { return 301 /014/; }
    location = /14/ { return 301 /014/; }
    location = /15 { return 301 /015/; }
    location = /15/ { return 301 /015/; }
    location = /16 { return 301 /016/; }
    location = /16/ { return 301 /016/; }

    location = /tools { return 302 https://shop.tapthingy.com/pages/tap-thingy-tools-nfc-reprogram-webtool-and-guide; }
    location = /tools/ { return 302 https://shop.tapthingy.com/pages/tap-thingy-tools-nfc-reprogram-webtool-and-guide; }
    location = /shop { return 302 https://shop.tapthingy.com/collections/all; }
    location = /shop/ { return 302 https://shop.tapthingy.com/collections/all; }

    # Video streaming optimizations (HTML5 range requests)
    location ~* \.(mp4|webm|ogg)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|json)$ {
        add_header Access-Control-Allow-Origin *;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Standard SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
