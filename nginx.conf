server {
    listen 80;
    server_name localhost tapgreetings.com www.tapgreetings.com;

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects preserve host & port
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Fast direct shortcut routing
    location = /01 {
        return 301 /delphine-holidays/;
    }
    location = /01/ {
        return 301 /delphine-holidays/;
    }
    location = /holidays {
        return 301 /delphine-holidays/;
    }
    location = /holidays/ {
        return 301 /delphine-holidays/;
    }
    location = /tools {
        return 302 https://shop.tapthingy.com/pages/tap-thingy-tools-nfc-reprogram-webtool-and-guide;
    }
    location = /tools/ {
        return 302 https://shop.tapthingy.com/pages/tap-thingy-tools-nfc-reprogram-webtool-and-guide;
    }
    location = /shop {
        return 302 https://shop.tapthingy.com/collections/tapgreetings;
    }
    location = /shop/ {
        return 302 https://shop.tapthingy.com/collections/tapgreetings;
    }

    # Video streaming optimizations (HTML5 range requests)
    location ~* \.(mp4|webm|ogg)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|json)$ {
        add_header Access-Control-Allow-Origin *;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Standard SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
